name: IndexNow

# After each production deploy, tell Bing and the other IndexNow engines which pages changed
# (`scripts/indexnow.mjs`): Vercel's (it reports them to GitHub as deployments) and, once SITE_DEPLOY is `on`,
# the Site workflow's (the Cloudflare Worker). Run it by hand with "all" after adding pages.
on:
  deployment_status:
  workflow_run:
    workflows: [Site]
    types: [completed]
  workflow_dispatch:
    inputs:
      all:
        description: Submit every URL in the sitemap
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && vars.SITE_DEPLOY == 'on')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/indexnow.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}
