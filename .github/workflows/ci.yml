name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The accounts API typechecks with the shared game code it bundles.
      - run: npm ci --prefix server
      - run: npm run typecheck --prefix server
      - run: npm run build --prefix server

  # The Playwright image the determinism shards run in: its tag follows the
  # version in package-lock.json, so a Playwright bump brings its browsers along.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  # The same scripted runs in Node, Chromium, Firefox and WebKit must hash the
  # same every 60 ticks (`npm run determinism`): co-op peers and the ranked
  # re-simulation rely on it. Four shards play a quarter of the runs each, side
  # by side, in Playwright's image (browsers and their system libraries already
  # in, so no apt or browser download to stall on).
  determinism:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    env:
      # Firefox refuses to start as root under a HOME it doesn't own.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: determinism (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run determinism -- --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: determinism-out-${{ matrix.shard }}
          path: determinism-out/
          if-no-files-found: ignore
