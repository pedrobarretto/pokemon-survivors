name: Asset CDN

# Deploys public/assets/ to the asset CDN (`cdn/`, a Cloudflare Worker with static assets only) when they change on
# main. The game's builds point a group of assets at the CDN only once it serves that group as built
# (`servedVersions` in cdn/versions.mjs), so this may land before or after Vercel's build.
on:
  push:
    branches: [main]
    paths: ['public/assets/**', 'cdn/**', 'src/assets.ts', '.github/workflows/cdn.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order: a newer push waits for the one running.
concurrency:
  group: asset-cdn
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN isn't set; the asset CDN wasn't deployed."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v7
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run cdn:deploy
      # Optional: a Vercel deploy hook rebuilds the site, so the groups this deploy brought move to the CDN now
      # rather than at the next push (until then they load from Vercel, which works, at Vercel's prices).
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
