name: Asset CDN

# Deploys the asset CDN (`cdn/`, a Cloudflare Worker) by hand: public/assets/ and the site builds' chunks it keeps.
# The site's production build deploys it on its own (`cdn/deploy.mjs`, part of `npm run build` where Vercel has
# CLOUDFLARE_API_TOKEN), so this is only for redeploying the assets without a site build. Don't run it while a
# Vercel build is deploying: the last deploy wins, and a build it didn't carry would load its chunks from the site.
on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order: a newer run waits for the one running.
concurrency:
  group: asset-cdn
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_ASSET_ORIGIN: https://ps-assets.pedrobarretto.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run cdn:deploy
