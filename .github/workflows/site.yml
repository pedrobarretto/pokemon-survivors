name: Site

# Builds the whole site and deploys it to its Cloudflare Worker (`ps-site`, worker/wrangler.jsonc): by hand any
# time, and on every push to main once the repo variable SITE_DEPLOY is `on`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order: each reads the live Worker's builds.json to carry the previous builds along.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.SITE_DEPLOY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # What the game's build reads (`import.meta.env`, .env.example): public values, so variables.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      VITE_COOP_URL: ${{ vars.VITE_COOP_URL }}
      VITE_COOP_URL_SA: ${{ vars.VITE_COOP_URL_SA }}
      VITE_COOP_URL_HK: ${{ vars.VITE_COOP_URL_HK }}
      # The source maps' upload (scripts/sourcemaps.mjs); without the key it only deletes them.
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `--keep` goes to the build's last step (worker/site.mjs): it carries the live Worker's kept builds along.
      - run: npm run build -- --keep
      - run: npx --yes wrangler@4.154.0 deploy --config worker/wrangler.jsonc
